# all75 Boltz2 subset: all four architectures on grouped by allele cluster.
#
# Every model here is trained and scored on the SAME ~14.5k rows (every row
# with an all75 Boltz2 embedding) - the sequence networks are restricted to
# them via `embeddings_dir`, and boltz-network can only see them anyway.
# Train them with `make all` (or `make make_model <net> ...`) from mlp-embeds/.

label: C2 (cluster)
out: all75_split_C2

models:
  - label: direct (MLP)
    figs_dir: ../direct-network/figs/all75_split_C2
    run: split C2 (cluster)
  - label: transformer
    figs_dir: ../transformer-network/figs/all75_split_C2
    run: split C2 (cluster)
  - label: SE+MLP
    figs_dir: ../squeeze-boost-network/figs/all75_split_C2
    run: split C2 (cluster) (SE+MLP)
  - label: SE+XGB
    figs_dir: ../squeeze-boost-network/figs/all75_split_C2
    run: split C2 (cluster) (SE+XGB)
  - label: boltz2 (frozen)
    figs_dir: ../boltz-network/figs/all75_split_C2
    run: split C2 (cluster)

caption: >-
  Only 22 clusters, so ~3 land in test: read C2 as a spread, not a point value.
