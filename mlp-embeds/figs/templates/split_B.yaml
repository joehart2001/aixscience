# Inter-model comparison on split B: grouped by peptide — unseen peptides, alleles still seen.
#
# Each model entry points at a network's figs dir and names a run inside its
# data/runs.json. Nothing is retrained — the test predictions saved by that
# network are reloaded and replotted on shared axes.
#
#   PY=../../.venv/bin/python
#   $PY plots.py templates/split_B.yaml

label: split B (grouped by peptide)
out: split_B             # subfolder under figs/compare/

models:
  - label: direct (MLP)
    figs_dir: ../direct-network/figs
    run: split B (peptide)
  - label: transformer
    figs_dir: ../transformer-network/figs
    run: split B (peptide)
  - label: SE+MLP
    figs_dir: ../squeeze-boost-network/figs/split_B
    run: split B (peptide) (SE+MLP)
  - label: SE+XGB
    figs_dir: ../squeeze-boost-network/figs/split_B
    run: split B (peptide) (SE+XGB)

# NOTE: boltz-network is deliberately absent. Its runs cover HLA-A*02:01 rows
# only, so its test set is a different set of rows and its bars would not be
# comparable. To include it, first retrain direct/transformer with the matching
# `allele` + `embeddings_dir` filters so all three share the same test rows.
