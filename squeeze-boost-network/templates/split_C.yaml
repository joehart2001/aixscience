# Split C — GROUP BY ALLELE: each unique allele appears in only one fold.
# Tests a new allele whose close relative may still be in training (the
# realistic clinical case).
#
# Compare all four splits:
#   python compare.py templates/split_A.yaml templates/split_B.yaml \
#                      templates/split_C.yaml templates/split_C2.yaml

label: split C (allele)
csv: ../Data/rasmussen_et_al_dataset.csv   # sequence source (joined by row_id)
splits_csv: ../Data/subsets/splits.csv     # precomputed split assignments
split: C                                   # which split_* column to use
hla_col: hla_pseudoseq                     # HLA representation fed to the model

# --- split label values inside the split_<X> column ---
train_value: train
val_value: val

# --- training hyperparameters ---
epochs: 30
batch_size: 128
lr: 0.001
weight_decay: 0.00001
seed: 0

# --- squeeze-and-excitation (omit any key to use the model's default) ---
model:
  aa_embed_dim: 16       # per-residue embedding width
  allele_embed_dim: 16   # allele vector
  hidden_dim: 256        # head width (matches direct-network's MLP)
  dropout: 0.2
  reduction: 8           # SE bottleneck ratio r: W1 is (C/r, C)
  squeeze_stats: true    # append per-field mean+variance to the gate input

# --- XGBoost stage (boost.py only; train.py ignores this) ---
xgb:
  n_estimators: 2000     # upper bound; early stopping on val picks the count
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  early_stopping_rounds: 50

# --- compute ---
device: auto        # auto = CUDA if available (prod GPU), else CPU (local); or force cpu/cuda
num_workers: 0      # raise on a production GPU box for faster data loading

# --- outputs ---
figs_dir: figs/split_C
out: null
