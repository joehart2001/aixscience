name: demo site

on:
  push:
    branches: [main]
    paths: ['demo_app_html/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo_app_html
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      # the same checks that run locally: every on-screen number traced back to
      # its source table, no label overlapping another, the bundle actually runs
      - run: node verify.js
      - run: node tools/check_text.js --width 1000
      - run: node tools/check_text.js --width 400
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo_app_html/dist/local

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
